spring.application.name=edusearch-backend
server.port=8080

spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Secrets are NEVER hardcoded. Set these as real environment variables
# (or a .env loaded by your process manager / docker-compose) before running:
#   export YOUTUBE_API_KEY=xxxx
#   export TAVILY_API_KEY=xxxx
# ---------------------------------------------------------------------------
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.api.base-url=https://www.googleapis.com/youtube/v3

tavily.api.key=${TAVILY_API_KEY:}
tavily.api.base-url=https://api.tavily.com/search

# ---------------------------------------------------------------------------
# No database in this pass - nothing is persisted (no accounts/history yet),
# so there's no datasource config here. If you add persistence later,
# reintroduce spring-boot-starter-data-jpa + a driver in pom.xml and put
# spring.datasource.* properties back here.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# App-specific tunables
# ---------------------------------------------------------------------------
edusearch.cache.ttl-seconds=1800
edusearch.search.max-videos=15
edusearch.search.max-articles=10

edusearch.ranking.view-weight=0.7
edusearch.ranking.recency-weight=0.3
edusearch.ranking.recency-half-life-days=180

# ---------------------------------------------------------------------------
# CORS
# Local development:
#   http://localhost:5173
#
# Production:
#   Set EDUSEARCH_CORS_ALLOWED_ORIGIN in Render environment variables
# ---------------------------------------------------------------------------
edusearch.cors.allowed-origin=${EDUSEARCH_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.edusearch=INFO